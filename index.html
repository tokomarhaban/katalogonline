<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Toko Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- HEADER & SEARCH BAR -->
    <header class="sticky top-0 z-30 bg-white shadow-md p-4">
        <div class="max-w-md mx-auto">
            <h1 class="text-xl font-bold text-green-600 mb-3 text-center">
                <i class="fa-solid fa-store mr-2"></i>Katalog Toko
            </h1>
            
            <!-- Kolom Pencarian Utama -->
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Cari nama barang (misal: Roma, Shampo, Minyak)..." 
                    class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 shadow-sm text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- DAFTAR PRODUK (GRID) -->
    <main class="max-w-md mx-auto p-4">
        <div id="productList" class="grid grid-cols-2 gap-3">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>
    </main>

    <!-- FLOATING FOOTER / BAR KERANJANG -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-lg z-40 hidden">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500"><span id="cartCount">0</span> Barang dipilih</p>
                <p class="text-lg font-bold text-green-600" id="cartTotal">Rp 0</p>
            </div>
            <button onclick="openCheckoutModal()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-semibold flex items-center gap-2 text-sm shadow">
                <i class="fa-solid fa-shopping-cart"></i> Lihat Pesanan
            </button>
        </div>
    </div>

    <!-- MODAL CHECKOUT & FORM PEMBELI -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-receipt mr-2 text-green-600"></i>Ringkasan Pesanan</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-500 hover:text-black text-xl">&times;</button>
            </div>

            <!-- List Barang di Keranjang -->
            <div id="modalCartItems" class="p-4 overflow-y-auto flex-1 divide-y">
                <!-- Diisi otomatis oleh JS -->
            </div>

            <!-- Form Pembeli -->
            <div class="p-4 bg-gray-50 border-t space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Pemesan*</label>
                    <input type="text" id="buyerName" placeholder="Contoh: Pak Budi" class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Catatan / Alamat Singkat</label>
                    <textarea id="buyerNote" rows="2" placeholder="Contoh: Ambil sendiri jam 4 sore / Antar ke toko sebelah" class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none"></textarea>
                </div>
                
                <button id="submitBtn" onclick="submitOrderToN8n()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold text-center flex justify-center items-center gap-2 shadow">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Kirim Pesan via WhatsApp
                </button>
            </div>
        </div>
    </div>

   <!-- JAVASCRIPT LOGIC -->
    <script>
        const N8N_GET_PRODUCTS_URL = "https://n8nnew.tokomarhaban.my.id/webhook/get-products";
        const N8N_WEBHOOK_URL = "https://n8nnew.tokomarhaban.my.id/webhook/pesanan-baru";

        let products = [];
        let cart = [];

        // 1. FETCH PRODUK DARI N8N
        async function fetchProductsFromSheets() {
            const container = document.getElementById("productList");
            if (!container) return;

            container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat katalog produk...</p>`;

            try {
                console.log("Memulai request ke n8n...");
                const response = await fetch(N8N_GET_PRODUCTS_URL);
                const data = await response.json();
                console.log("Data n8n berhasil diterima:", data);

                let productList = [];
                if (Array.isArray(data) && data[0] && data[0].products) {
                    productList = data[0].products;
                } else if (data && data.products) {
                    productList = data.products;
                } else if (Array.isArray(data)) {
                    productList = data;
                }

                console.log("Total produk siap tampil:", productList.length);

                if (productList && productList.length > 0) {
                    products = productList;
                    renderProducts(products);
                } else {
                    container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8">Belum ada produk yang tersedia saat ini.</p>`;
                }
            } catch (error) {
                console.error("Gagal mengambil data produk:", error);
                container.innerHTML = `<p class="col-span-2 text-center text-red-500 py-8">Gagal memuat katalog. Pastikan workflow n8n aktif.</p>`;
            }
        }

       // 2. RENDER SEMUA PRODUK DENGAN MANAJEMEN HTML SAFE
function renderProducts(items) {
    const container = document.getElementById("productList");
    if (!container) return;

    if (!items || items.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8">Produk tidak ditemukan.</p>`;
        return;
    }

    // Menggunakan array join agar proses pembuatan HTML 2400+ barang sangat cepat & tidak macet
    const htmlCards = items.map(p => {
        const imgUrl = p.img || 'https://via.placeholder.com/150';
        const priceFormatted = Number(p.price || 0).toLocaleString("id-ID");
        const nameClean = (p.name || 'Tanpa Nama').replace(/"/g, '&quot;');
        const productId = String(p.id || '').replace(/'/g, "\\'");

        return `
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <img src="${imgUrl}" alt="${nameClean}" class="w-full h-28 object-cover rounded-lg mb-2" loading="lazy">
                    <h3 class="font-semibold text-gray-800 text-xs line-clamp-2 mb-1">${nameClean}</h3>
                    <p class="text-green-600 font-bold text-xs mb-2">Rp ${priceFormatted}</p>
                </div>
                <button onclick="addToCart('${productId}')" class="w-full bg-green-50 text-green-600 hover:bg-green-600 hover:text-white font-medium py-1.5 rounded-lg text-xs transition">
                    + Tambah
                </button>
            </div>
        `;
    }).join("");

    container.innerHTML = htmlCards;
}

// 3. FITUR SEARCH LANGSUNG
function filterProducts() {
    const query = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
    if (!query) {
        renderProducts(products);
        return;
    }
    const filtered = products.filter(p => String(p.name || "").toLowerCase().includes(query));
    renderProducts(filtered);
}

        // 4. KERANJANG BELANJA
        function addToCart(productId) {
            const item = products.find(p => String(p.id) === String(productId));
            if (!item) return;

            const exist = cart.find(c => String(c.id) === String(productId));
            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function updateQty(productId, change) {
            const index = cart.findIndex(c => String(c.id) === String(productId));
            if (index !== -1) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
            }
            updateCartUI();
            renderModalItems();
        }

        function updateCartUI() {
            const cartBar = document.getElementById("cartBar");
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (totalItems > 0) {
                cartBar.classList.remove("hidden");
                document.getElementById("cartCount").innerText = totalItems;
                document.getElementById("cartTotal").innerText = "Rp " + totalPrice.toLocaleString('id-ID');
            } else {
                cartBar.classList.add("hidden");
                closeCheckoutModal();
            }
        }

        // 5. MODAL CHECKOUT
        function openCheckoutModal() {
            renderModalItems();
            document.getElementById("checkoutModal").classList.remove("hidden");
        }

        function closeCheckoutModal() {
            document.getElementById("checkoutModal").classList.add("hidden");
        }

        function renderModalItems() {
            const container = document.getElementById("modalCartItems");
            container.innerHTML = "";

            cart.forEach(item => {
                const itemTotal = (item.price * item.qty).toLocaleString('id-ID');
                container.innerHTML += `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <p class="font-medium text-sm">${item.name}</p>
                            <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty} = Rp ${itemTotal}</p>
                        </div>
                        <div class="flex items-center gap-2 border rounded-lg px-2 py-1">
                            <button onclick="updateQty('${item.id}', -1)" class="text-gray-500 font-bold px-1">-</button>
                            <span class="text-sm font-semibold">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="text-green-600 font-bold px-1">+</button>
                        </div>
                    </div>
                `;
            });
        }

        // 6. KIRIM PESANAN KE N8N
        async function submitOrderToN8n() {
            const buyerName = document.getElementById("buyerName").value.trim();
            const buyerNote = document.getElementById("buyerNote").value.trim();

            if (!buyerName) {
                alert("Mohon isi Nama Pemesan terlebih dahulu.");
                return;
            }

            const btn = document.getElementById("submitBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;
            btn.disabled = true;

            const payload = {
                buyer_name: buyerName,
                buyer_note: buyerNote,
                cart_items: cart,
                total_price: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
            };

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                let targetUrl = data.whatsapp_url || (data[0] && data[0].whatsapp_url);

                if (targetUrl) {
                    targetUrl = targetUrl.replace(/^=/, '').trim();
                    window.location.href = targetUrl;
                } else {
                    alert("Gagal mendapatkan link WhatsApp dari server.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Gagal terhubung ke server n8n.");
            } finally {
                btn.innerHTML = `<i class="fa-brands fa-whatsapp text-xl"></i> Kirim Pesan via WhatsApp`;
                btn.disabled = false;
            }
        }

        // PEMANGGILAN UTAMA SAAT SCRIPT SELESAI DIMUAT
        document.addEventListener("DOMContentLoaded", function() {
            fetchProductsFromSheets();
        });
    </script>
</body>
</html>
