<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Marhaban - Katalog Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        /* Sembunyikan scrollbar bawaan pada filter huruf */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- HEADER, LOGO, SEARCH BAR & FILTER HURUF -->
    <header class="sticky top-0 z-30 bg-white shadow-md py-3 px-4">
        <div class="max-w-2xl mx-auto flex flex-col items-center gap-2.5">
            
            <!-- LOGO & NAMA TOKO -->
            <div class="flex items-center justify-center gap-2">
                <img src="logo.png" alt="Toko Marhaban" class="h-9 w-auto object-contain" onerror="this.style.display='none'">
                <h1 class="text-xl font-bold text-blue-700 tracking-tight">Toko Marhaban</h1>
            </div>
            
            <!-- KOLOM PENCARIAN UTAMA -->
            <div class="relative w-full">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Cari nama barang (misal: Roma, Shampo, Minyak)..." 
                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
            </div>

            <!-- BILAH FILTER HURUF (MERAH-BIRU RESPONSIF) -->
            <div class="w-full flex items-center justify-start sm:justify-center sm:flex-wrap gap-1 overflow-x-auto sm:overflow-x-visible py-1 text-xs no-scrollbar" id="letterFilterContainer">
                <button onclick="selectLetter('semua', event)" class="letter-btn bg-red-600 text-white px-2.5 py-1 rounded-full font-bold whitespace-nowrap shadow-sm shrink-0">Semua</button>
                <button onclick="selectLetter('0-9', event)" class="letter-btn bg-gray-200 text-gray-700 px-2 py-1 rounded-full font-semibold whitespace-nowrap hover:bg-gray-300 shrink-0">0-9</button>
                <!-- Tombol A-Z di-generate otomatis via JS -->
            </div>

        </div>
    </header>

    <!-- DAFTAR PRODUK (GRID) -->
    <main class="max-w-md mx-auto p-4">
        <div id="productList" class="grid grid-cols-2 gap-3">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>
    </main>

    <!-- FLOATING FOOTER / BAR KERANJANG -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-2xl z-40 hidden">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500"><span id="cartCount">0</span> Barang dipilih</p>
                <p class="text-lg font-bold text-red-600" id="cartTotal">Rp 0</p>
            </div>
            <button onclick="openCheckoutModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl font-semibold flex items-center gap-2 text-sm shadow-md transition">
                <i class="fa-solid fa-shopping-cart"></i> Lihat Pesanan
            </button>
        </div>
    </div>

    <!-- MODAL CHECKOUT & FORM PEMBELI -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="font-bold text-lg text-blue-800"><i class="fa-solid fa-receipt mr-2 text-red-600"></i>Ringkasan Pesanan</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-500 hover:text-black text-xl">&times;</button>
            </div>

            <!-- List Barang di Keranjang -->
            <div id="modalCartItems" class="p-4 overflow-y-auto flex-1 divide-y">
                <!-- Diisi otomatis oleh JS -->
            </div>

            <!-- Form Pembeli -->
            <div class="p-4 bg-gray-50 border-t space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Pemesan*</label>
                    <input type="text" id="buyerName" placeholder="Contoh: Pak Budi" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Catatan / Alamat Singkat</label>
                    <textarea id="buyerNote" rows="2" placeholder="Contoh: Ambil sendiri jam 4 sore / Antar ke toko sebelah" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none"></textarea>
                </div>
                
                <button id="submitBtn" onclick="submitOrderToN8n()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold text-center flex justify-center items-center gap-2 shadow-md transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Kirim Pesan via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const N8N_GET_PRODUCTS_URL = "https://n8nnew.tokomarhaban.my.id/webhook/get-products";
        const N8N_WEBHOOK_URL = "https://n8nnew.tokomarhaban.my.id/webhook/pesanan-baru";

        let products = [];
        let cart = [];
        let selectedLetter = "semua";

        // 1. GENERATE TOMBOL HURUF A-Z
        function generateLetterButtons() {
            const container = document.getElementById("letterFilterContainer");
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            
            alphabet.forEach(letter => {
                const btn = document.createElement("button");
                btn.innerText = letter;
                btn.onclick = (e) => selectLetter(letter, e);
                btn.className = "letter-btn bg-gray-200 text-gray-700 px-2 py-1 rounded-full font-semibold whitespace-nowrap text-xs transition hover:bg-gray-300 shrink-0";
                container.appendChild(btn);
            });
        }

        // 2. LOGIKA PILIH HURUF
        function selectLetter(letter, eventObj) {
            selectedLetter = letter;
            
            // Ubah gaya tombol aktif (pakai warna merah agar kontras)
            document.querySelectorAll(".letter-btn").forEach(btn => {
                btn.classList.replace("bg-red-600", "bg-gray-200");
                btn.classList.replace("text-white", "text-gray-700");
            });

            const targetBtn = eventObj ? eventObj.target : document.querySelector('.letter-btn');
            if (targetBtn) {
                targetBtn.classList.replace("bg-gray-200", "bg-red-600");
                targetBtn.classList.replace("text-gray-700", "text-white");
            }

            filterProducts();
        }

        // 3. FETCH PRODUK DARI N8N & URUTKAN A-Z
        async function fetchProductsFromSheets() {
            const container = document.getElementById("productList");
            if (!container) return;

            container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8"><i class="fa-solid fa-spinner fa-spin mr-2 text-blue-600"></i>Memuat katalog produk...</p>`;

            try {
                const response = await fetch(N8N_GET_PRODUCTS_URL);
                const data = await response.json();

                let productList = [];
                if (Array.isArray(data) && data[0] && data[0].products) {
                    productList = data[0].products;
                } else if (data && data.products) {
                    productList = data.products;
                } else if (Array.isArray(data)) {
                    productList = data;
                }

                if (productList && productList.length > 0) {
                    productList.sort((a, b) => {
                        const nameA = (a.name || "").trim().toUpperCase();
                        const nameB = (b.name || "").trim().toUpperCase();
                        return nameA.localeCompare(nameB, 'id', { numeric: true });
                    });

                    products = productList;
                    renderProducts(products);
                } else {
                    container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8">Belum ada produk yang tersedia saat ini.</p>`;
                }
            } catch (error) {
                console.error("Gagal mengambil data produk:", error);
                container.innerHTML = `<p class="col-span-2 text-center text-red-500 py-8">Gagal memuat katalog. Pastikan workflow n8n aktif.</p>`;
            }
        }

        // 4. RENDER SEMUA PRODUK
        function renderProducts(items) {
            const container = document.getElementById("productList");
            if (!container) return;

            if (!items || items.length === 0) {
                container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8">Produk tidak ditemukan.</p>`;
                return;
            }

            const htmlCards = items.map(p => {
                const nameClean = (p.name || 'Tanpa Nama').replace(/"/g, '&quot;');
                const priceFormatted = Number(p.price || 0).toLocaleString("id-ID");
                const productId = String(p.id || '').replace(/'/g, "\\'");

                return `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <h3 class="font-semibold text-gray-800 text-xs line-clamp-2 mb-1">${nameClean}</h3>
                            <p class="text-red-600 font-bold text-xs mb-3">Rp ${priceFormatted}</p>
                        </div>
                        <button onclick="addToCart('${productId}')" class="w-full bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white font-medium py-1.5 rounded-lg text-xs transition">
                            + Tambah
                        </button>
                    </div>
                `;
            }).join("");

            container.innerHTML = htmlCards;
        }

        // 5. FITUR SEARCH & FILTER HURUF TERPADU
        function filterProducts() {
            const query = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();

            const filtered = products.filter(p => {
                const nameClean = (p.name || "").trim();
                const nameLower = nameClean.toLowerCase();
                const firstChar = nameClean.charAt(0).toUpperCase();

                const matchQuery = !query || nameLower.includes(query);

                let matchLetter = true;
                if (selectedLetter === "0-9") {
                    matchLetter = /^[0-9]/.test(firstChar);
                } else if (selectedLetter !== "semua") {
                    matchLetter = firstChar === selectedLetter;
                }

                return matchQuery && matchLetter;
            });

            renderProducts(filtered);
        }

        // 6. KERANJANG BELANJA
        function addToCart(productId) {
            const item = products.find(p => String(p.id) === String(productId));
            if (!item) return;

            const exist = cart.find(c => String(c.id) === String(productId));
            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function updateQty(productId, change) {
            const index = cart.findIndex(c => String(c.id) === String(productId));
            if (index !== -1) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
            }
            updateCartUI();
            renderModalItems();
        }

        function updateCartUI() {
            const cartBar = document.getElementById("cartBar");
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (totalItems > 0) {
                cartBar.classList.remove("hidden");
                document.getElementById("cartCount").innerText = totalItems;
                document.getElementById("cartTotal").innerText = "Rp " + totalPrice.toLocaleString('id-ID');
            } else {
                cartBar.classList.add("hidden");
                closeCheckoutModal();
            }
        }

        // 7. MODAL CHECKOUT
        function openCheckoutModal() {
            renderModalItems();
            document.getElementById("checkoutModal").classList.remove("hidden");
        }

        function closeCheckoutModal() {
            document.getElementById("checkoutModal").classList.add("hidden");
        }

        function renderModalItems() {
            const container = document.getElementById("modalCartItems");
            container.innerHTML = "";

            cart.forEach(item => {
                const itemTotal = (item.price * item.qty).toLocaleString('id-ID');
                container.innerHTML += `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <p class="font-medium text-sm text-gray-800">${item.name}</p>
                            <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty} = <span class="text-red-600 font-semibold">Rp ${itemTotal}</span></p>
                        </div>
                        <div class="flex items-center gap-2 border rounded-lg px-2 py-1 bg-gray-50">
                            <button onclick="updateQty('${item.id}', -1)" class="text-gray-500 font-bold px-1 hover:text-red-600">-</button>
                            <span class="text-sm font-semibold">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="text-blue-600 font-bold px-1 hover:text-blue-800">+</button>
                        </div>
                    </div>
                `;
            });
        }

        // 8. KIRIM PESANAN KE N8N
        async function submitOrderToN8n() {
            const buyerName = document.getElementById("buyerName").value.trim();
            const buyerNote = document.getElementById("buyerNote").value.trim();

            if (!buyerName) {
                alert("Mohon isi Nama Pemesan terlebih dahulu.");
                return;
            }

            const btn = document.getElementById("submitBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;
            btn.disabled = true;

            const payload = {
                buyer_name: buyerName,
                buyer_note: buyerNote,
                cart_items: cart,
                total_price: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
            };

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                let targetUrl = data.whatsapp_url || (data[0] && data[0].whatsapp_url);

                if (targetUrl) {
                    targetUrl = targetUrl.replace(/^=/, '').trim();
                    window.location.href = targetUrl;
                } else {
                    alert("Gagal mendapatkan link WhatsApp dari server.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Gagal terhubung ke server n8n.");
            } finally {
                btn.innerHTML = `<i class="fa-brands fa-whatsapp text-xl"></i> Kirim Pesan via WhatsApp`;
                btn.disabled = false;
            }
        }

        // JALANKAN PROGRAM
        document.addEventListener("DOMContentLoaded", function() {
            generateLetterButtons();
            fetchProductsFromSheets();
        });
    </script>
</body>
</html>
